<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>The Guild Defence</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #1a0e0a;
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: 'Press Start 2P', monospace;
            image-rendering: pixelated;
        }
        #game-container {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex; align-items: center; justify-content: center;
        }
        canvas { display: block; cursor: crosshair; image-rendering: pixelated; }
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a0e0a;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #d4a862; z-index: 1000;
        }
        #loader h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 20px; margin-bottom: 6px; color: #f0c866;
            text-shadow: 2px 2px 0 #3a1e0a, -1px -1px 0 #3a1e0a;
        }
        #loader .subtitle {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px; color: #8a6a42; margin-bottom: 28px; letter-spacing: 3px;
        }
        #loader .bar-bg {
            width: 240px; height: 12px; background: #2a1a0e;
            border: 2px solid #6a4a2a; image-rendering: pixelated;
        }
        #loader .bar-fill {
            width: 0%; height: 100%;
            background: #d4a862;
            transition: width 0.3s steps(10);
        }
        #loader p {
            margin-top: 14px; font-size: 8px; color: #6a4a2a;
            font-family: 'Press Start 2P', monospace;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
        #loader .dots { animation: blink 1s steps(2) infinite; }
    </style>
</head>
<body>
    <div id="loader">
        <h2>The Guild Defence</h2>
        <div class="subtitle">TOWER DEFENSE</div>
        <div class="bar-bg"><div class="bar-fill" id="load-bar"></div></div>
        <p id="load-text" class="dots">Loading...</p>
    </div>
    <div id="game-container"></div>

    <script src="https://yandex.ru/games/sdk/v2"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

    <script src="js/config.js"></script>
    <script src="js/SoundManager.js"></script>
    <script src="js/VFX.js"></script>
    <script src="js/Enemy.js"></script>
    <script src="js/Projectile.js"></script>
    <script src="js/Magic.js"></script>
    <script src="js/UpgradeScene.js"></script>
    <script src="js/MenuScene.js"></script>
    <script src="js/GameScene.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
